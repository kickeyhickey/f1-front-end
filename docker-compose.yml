services:
  workspace:
    build:
      context: .
      args:
        CORDOVA_VERSION: ${CORDOVA_VERSION:-12.0.0}
        IONIC_VERSION: ${IONIC_VERSION:-7.2.1}
        NODE_VERSION: ${NODE_VERSION:-20}
        DEBIAN_VERSION: ${DEBIAN_VERSION:-12.9}
        GRADLE_VERSION: ${GRADLE_VERSION:-8.14.2}
        JAVA_VERSION: ${JAVA_VERSION:-21}
        ANDROID_SDK: ${ANDROID_SDK:-35}
        ANDROID_BUILD_TOOLS_VERSION: ${ANDROID_BUILD_TOOLS_VERSION:-35.0.0}
        ANDROID_COMMANDLINE_TOOLS: ${ANDROID_COMMANDLINE_TOOLS:-13114758}
    
    container_name: f1-app
    networks:
      - f1-network
    restart: unless-stopped

networks:
  f1-network:
    external: true