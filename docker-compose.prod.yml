version: "3.8"

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.prod
    
    container_name: f1-app-prod
    
    ports:
      - '127.0.0.1:5174:80'  # Bind to localhost only - accessible via nginx only
    
    restart: unless-stopped
    
    networks:
      - f1-network

networks:
  f1-network:
    external: true